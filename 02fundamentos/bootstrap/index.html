<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> FlorManía versión BS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        header {
            background-color: #D5A6BD;
            display: flex;
            width: 100%;
            padding: 2% 6%;
            align-items: center;
        }

        #flor {
            color: #f5f5f5;
        }

        #navHeader {
            font-size: large;
            margin-left: auto;
            padding-right: 12px;
        }

        #login {
            background-color: #f5f5f5;
            border: none;
            padding: 0.5% 1%;
        }

        #navMain {
            background-color: #CCCCCC;
            width: 100%;
            height: fit-content;
            padding: 1.5% 11%;
        }

        ul {
            list-style: none;
            display: flex;
            gap: 16px;
        }

        #navMain ul {
            justify-content: space-between;
        }

        #hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        #hero h2 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 28px;
        }

        a:link {
            color: #A64D79;
        }

        a:visited {
            color: #793958;
        }

        #results {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 10%;
            padding: 24px 0;
        }

        #products {
            display: flex;
            justify-content: space-between;
            margin: 0 10% 1%;
            gap: 24px;
        }

        .card {
            background-color: #EEEEEE;
            width: 31%;
            height: fit-content;
            padding: 1.4%;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: auto;
            align-self: center;
            margin-bottom: 8px;
        }

        .cardFooter {
            display: flex;
            justify-content: space-between;
        }

        .product {
            font-style: italic;
            text-decoration: underline;
        }

        .price {
            color: #A64D79;
            font-weight: bold;
        }

        .buy {
            background-color: #C27BA0;
            color: #f5f5f5;
            font-size: medium;
            border: none;
            width: fit-content;
            height: fit-content;
            padding: 9px 12px;
            align-self: flex-end;
        }

        footer {
            background-color: #D5A6BD;
            color: #D5A6BD;
        }
    </style>
</head>

<body>

            </div>

                <button type="button">Comprar</button>
            </div>
            <div class="col-sm-12 col-md-4  bg-secondary">

                <p>Bouquet Lirios</p>

    <header>
        <h1><span id="flor">Flor</span>Manía</h1>
        <nav id="navHeader">
            <ul>
                <li id="send" onmouseover="toggleTxt(true)" onmouseout="toggleTxt(false)">Envía Flores</li>
                <li id="us">Nosotros</li>
            </ul>
        </nav>
        <button id="login" onclick="popAlert()">Iniciar Sesión</button>
    </header>
    <nav id="navMain">
        <ul>
            <li>Girasoles</li>
            <li>Rosas</li>
            <li>Claveles</li>
            <li>Tulipanes</li>
            <li>Orquídeas</li>
            <li>Margaritas</li>
        </ul>
    </nav>
    <main>
        <section id="hero">
            <h2>Flor del Mes</h2>
            <img src="https://placehold.co/1200x338" alt="Flor del mes">
        </section>
        <section id="results">
            <p>Mostrando <strong>50 resultados</strong></p>
            <a href="#" target="_blank">Ver más Flores</a>
        </section>
        <section id="products">
            <article class="card">
                <img src="https://placehold.co/1500x700" alt="Ramo de rosas">
                <div class="cardFooter">
                    <div class="specs">
                        <p class="product">Ramo de Rosas</p>
                        <p class="price">$40.00</p>
                    </div>
                    <button class="buy" onclick="disappearBtn(this)">Comprar</button>
                </div>
            </article>
            <article class="card">
                <img src="https://placehold.co/1500x700" alt="Arreglo tulipanes">
                <div class="cardFooter">
                    <div class="specs">
                        <p class="product">Arreglo Tulipanes</p>
                        <p class="price">$50.00</p>
                    </div>
                    <button class="buy" onclick="disappearBtn(this)">Comprar</button>
                </div>
            </article>
            <article class="card">
                <img src="https://placehold.co/1500x700" alt="Bouquet lirios">
                <div class="cardFooter">
                    <div class="specs">
                        <p class="product">Bouquet Lirios</p>
                        <p class="price">$25.00</p>
                    </div>
                    <button class="buy" onclick="disappearBtn(this)">Comprar</button>
                </div>
            </article>
        </section>
    </main>
    <footer>*</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
            //Y después de darle algunas cuantas vueltas, logré este:
            function toggleTxt(isHover) {
                const navTxt = document.getElementById("send");
                if (isHover) {
                    navTxt.innerText = "Envía Bouquets";
                } else {
                    navTxt.innerText = "Envía Flores";
                }
            }

            //Al hacer click en los botones "Comprar", deben desaparecer
            function disappearBtn(element) {
                element.remove();
            }
            //Al hacer click en botón "Iniciar sesión", debe mostrar alerta con bienvenida (Bienvenido a la tienda de flores)
            function popAlert() {
                alert("Bienvenid@ a la tienda de flores");
            }
        </script>

</body>

</html>
